# GitHub Actions pipeline for DigiBank.
#
# The workflow runs on pushes and pull requests to main. It verifies the Maven build, scans the source
# tree for vulnerabilities/secrets/misconfigurations, scans the built Docker image, and runs a Docker
# Compose smoke test against real HTTP endpoints. These remote checks make the DevSecOps evidence less
# dependent on a single developer machine.
#
name: DigiBank CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: digibank-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

  static-analysis:
    name: SpotBugs / Find Security Bugs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run SpotBugs with Find Security Bugs
        run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: "**/target/spotbugsXml.xml"
          if-no-files-found: warn

  pmd:
    name: PMD quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run aggregate PMD gate
        run: mvn -B pmd:aggregate-pmd-check

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            target/pmd.xml
            target/reports/pmd.html
          if-no-files-found: warn

  dependency-analysis:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:check
          -DnvdApiKey="${NVD_API_KEY}"
        continue-on-error: true

      - name: Validate Dependency-Check report exists
        run: |
          if [[ ! -f target/dependency-check-report.html ]]; then
            echo "Dependency-Check failed to generate report"
            exit 1
          fi
        shell: bash
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: "**/target/dependency-check-report.html"
          if-no-files-found: warn

  mutation-testing:
    name: PITest mutation testing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run mutation testing
        run: |
          mvn -B clean install -DskipTests
          mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: "**/target/pit-reports"
          if-no-files-found: warn

  filesystem-security-scan:
    name: Filesystem security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source, dependencies, config, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  container-security-scan:
    name: Container security scan
    runs-on: ubuntu-latest
    needs:
      - verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digibank-workshop1:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digibank-workshop1:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - verify

    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up --build -d

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi

            echo "Waiting for DigiBank health endpoint (${attempt}/30)"
            sleep 5
          done

          docker compose logs
          exit 1

      - name: Verify OpenAPI endpoint
        run: curl -fsS http://127.0.0.1:8080/v3/api-docs | grep -q '"title":"DigiBank API"'

      - name: Exercise transfer workflow
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"sourceAccountNumber":"100000000001","targetAccountNumber":"100000000002","amount":25.00,"description":"CI smoke test"}' \
            http://127.0.0.1:8080/api/v1/transfers \
            | grep -q '"status":"SUCCESS"'

      - name: Stop application stack
        if: always()
        run: docker compose down
