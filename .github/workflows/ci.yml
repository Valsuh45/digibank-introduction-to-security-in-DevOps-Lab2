# GitHub Actions pipeline for DigiBank.
#
# The workflow runs on pushes and pull requests to main. It verifies the Maven build, scans the source
# tree for vulnerabilities/secrets/misconfigurations, scans the built Docker image, and runs a Docker
# Compose smoke test against real HTTP endpoints. These remote checks make the DevSecOps evidence less
# dependent on a single developer machine.
#
name: DigiBank CI Pipeline

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  workflow_dispatch:
    inputs:
      audit_history:
        description: "Run full redacted history audit (known exposed key still requires owner rotation)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: digibank-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Upload coverage and style reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-checkstyle
          path: |
            **/target/site/jacoco*/
            **/target/checkstyle-result.xml
            **/target/surefire-reports/
          if-no-files-found: error

  secret-scan:
    name: Gitleaks current source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan checked-out source with redacted output
        run: |
          mkdir -p target
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            dir /repo --config /repo/.gitleaks.toml --redact=100 \
            --report-format json --report-path /repo/target/gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-redacted
          path: target/gitleaks.json
          if-no-files-found: error

  secret-history-audit:
    name: Gitleaks full history audit
    if: github.event_name == 'workflow_dispatch' && inputs.audit_history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit all fetched history with redacted output
        run: |
          mkdir -p target
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --log-opts=--all --config /repo/.gitleaks.toml --redact=100 \
            --report-format json --report-path /repo/target/gitleaks-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-history-redacted
          path: target/gitleaks-history.json
          if-no-files-found: error

  sonarqube:
    name: SonarQube quality gate
    # Forks do not receive credentials; never use pull_request_target to scan untrusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate SonarQube configuration
        run: |
          test -n "$SONAR_TOKEN" && test -n "$SONAR_HOST_URL" && test -n "$SONAR_PROJECT_KEY" || {
            echo "Configure SONAR_TOKEN secret and SONAR_HOST_URL / SONAR_PROJECT_KEY variables"; exit 1;
          }
      - name: Analyze and wait for server quality gate
        run: >-
          mvn -B clean verify sonar:sonar
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-analysis-task
          path: target/sonar/report-task.txt
          if-no-files-found: warn

  static-analysis:
    name: SpotBugs / Find Security Bugs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run SpotBugs with Find Security Bugs
        run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: "**/target/spotbugsXml.xml"
          if-no-files-found: warn

  pmd:
    name: PMD quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run aggregate PMD gate
        run: mvn -B pmd:aggregate-pmd-check

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            target/pmd.xml
            target/reports/pmd.html
          if-no-files-found: warn

  dependency-analysis:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: /tmp/dependency-check-data
          key: nvd-data-cache-${{ github.run_number }}
          restore-keys: |
            nvd-data-cache-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build dependency reactor
        run: mvn -B clean install -DskipTests

      - name: Run dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY" || { echo "Configure the rotated NVD_API_KEY repository secret"; exit 1; }
          mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  mutation-testing:
    name: PITest mutation testing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run mutation testing
        run: |
          mvn -B clean install -DskipTests
          mvn -B -pl customer-module,account-module,transfer-module org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: "**/target/pit-reports"
          if-no-files-found: warn

  filesystem-security-scan:
    name: Filesystem security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source, dependencies, config, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  container-security-scan:
    name: Container security scan
    runs-on: ubuntu-latest
    needs:
      - verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digibank-workshop1:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digibank-workshop1:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - verify

    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up --build -d

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi

            echo "Waiting for DigiBank health endpoint (${attempt}/30)"
            sleep 5
          done

          docker compose logs
          exit 1

      - name: Verify OpenAPI endpoint
        run: curl -fsS http://127.0.0.1:8080/v3/api-docs | grep -q '"title":"DigiBank API"'

      - name: Exercise transfer workflow
        run: python3 scripts/verify-workshop1.py --base-url http://127.0.0.1:8080

      - name: Upload HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop1-http
          path: target/workshop1-http.json
          if-no-files-found: warn

      - name: Stop application stack
        if: always()
        run: docker compose down
