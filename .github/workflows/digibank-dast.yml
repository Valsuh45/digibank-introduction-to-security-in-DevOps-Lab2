# DigiBank DAST CI/CD pipeline (Workshop 3).
#
# Two levels:
#   1. dast-newman (blocking): a lightweight, frequent dynamic check. It starts PostgreSQL and DigiBank
#      with the 'ci' profile (Swagger disabled), waits for the API, and replays the DAST validation
#      Postman collection with Newman. Reports and the application log are uploaded as artifacts.
#   2. dast-zap (observation, non-blocking): a heavier, less frequent check. It runs the app through
#      Docker Compose and launches an OWASP ZAP baseline scan against it. The job uses continue-on-error
#      so ZAP results are published as evidence without abruptly failing the pipeline (spec 6.13).
#
name: DigiBank DAST Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digibank-dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast-newman:
    name: DAST level 1 - Newman dynamic checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digibankdb
          POSTGRES_USER: digibank
          POSTGRES_PASSWORD: digibank123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U digibank -d digibankdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/digibankdb
      SPRING_DATASOURCE_USERNAME: digibank
      SPRING_DATASOURCE_PASSWORD: digibank123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build DigiBank
        # install (not just verify) so the sibling module jars/POMs are available in the local Maven
        # repository when the later `spring-boot:run -pl digibank-web` resolves its module dependencies.
        run: mvn -B clean install -DskipTests

      - name: Start DigiBank
        run: |
          nohup mvn -B spring-boot:run -pl digibank-web > digibank.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is up"
              exit 0
            fi
            # Fail fast if the background spring-boot process has already exited.
            if ! pgrep -f "spring-boot:run|DigiBankApplication" > /dev/null; then
              echo "DigiBank process exited before becoming healthy"
              tail -120 digibank.log
              exit 1
            fi
            echo "Waiting for DigiBank (${attempt}/40)"
            sleep 5
          done
          echo "Application did not start in time"
          tail -120 digibank.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman newman-reporter-html

      - name: Run Newman DAST suite
        run: |
          mkdir -p dast/reports
          newman run dast/postman/DigiBank-DAST-Validation.postman_collection.json \
            -e dast/postman/DigiBank-local.postman_environment.json \
            --env-var baseUrl=http://localhost:8080 \
            --reporters cli,html,json \
            --reporter-html-export dast/reports/newman-report.html \
            --reporter-json-export dast/reports/newman-report.json

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-dast-reports
          path: dast/reports/
          if-no-files-found: warn

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digibank-app-log
          path: digibank.log
          if-no-files-found: warn

  dast-zap:
    name: DAST level 2 - OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: dast-newman

    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is up"
              exit 0
            fi
            echo "Waiting for DigiBank (${attempt}/40)"
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run OWASP ZAP baseline scan
        # Observation mode: results are published as evidence without blocking the pipeline.
        continue-on-error: true
        run: |
          mkdir -p dast/reports
          # The ZAP container runs as the 'zap' user (uid 1000), so the mounted reports directory must
          # be writable by it, otherwise report generation fails with a permission error.
          chmod 777 dast/reports
          # Relative report paths are resolved inside the container's /zap/wrk working directory,
          # which is the same directory as the host-mounted dast/reports.
          docker run --rm --network host \
            -v "${{ github.workspace }}/dast/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 \
              -r zap-report.html \
              -J zap-report.json \
              -m 5 -j

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: dast/reports/
          if-no-files-found: warn

      - name: Stop application stack
        if: always()
        run: docker compose down
