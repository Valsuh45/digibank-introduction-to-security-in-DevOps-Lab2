# Main Spring Boot configuration for DigiBank.
#
# Database connection values come from environment variables so credentials are not committed to the
# repository. Hibernate validates the schema instead of creating it because Flyway owns database changes.
# Server error settings avoid exposing exception names, messages, or stack traces to API clients.
#
spring:
  application:
    name: digibank
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:digibank}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.postgresql.Driver

logging:
  level:
    com.m2ibank: INFO
