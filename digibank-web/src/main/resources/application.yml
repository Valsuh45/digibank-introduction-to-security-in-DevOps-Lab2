# Main Spring Boot configuration for DigiBank.
#
# Database connection values come from environment variables so credentials are not committed to the
# repository. Hibernate validates the schema instead of creating it because Flyway owns database changes.
# Server error settings avoid exposing exception names, messages, or stack traces to API clients.
#
spring:
  application:
    name: digibank
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:digibank}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

# OpenAPI / Swagger is disabled by default to reduce the exposed attack surface outside
# development. It is re-enabled only under the `dev` profile (see below) and under the
# `test` profile (application-test.yml) so the documentation contract can still be verified.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.postgresql.Driver

# Interactive API documentation is a development convenience only. It stays available in the
# dev profile for local work and is disabled in every other environment by default.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.m2ibank: INFO

---
# Production profile: disable interactive API documentation so the attack surface is reduced.
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
